services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: foodbridge
      POSTGRES_USER: foodbridge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - foodbridge-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U foodbridge]
      interval: 10s
      retries: 5
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://foodbridge:${DB_PASSWORD}@db:5432/foodbridge
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      PRIVACY_RETENTION_SUMMARY: ${PRIVACY_RETENTION_SUMMARY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      ONEMAP_EMAIL: ${ONEMAP_EMAIL:-}
      ONEMAP_PASSWORD: ${ONEMAP_PASSWORD:-}
      DEMO_DATA: ${DEMO_DATA:-false}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-./backend/data/firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    ports: ["8000:8000"]
    restart: unless-stopped
  maintenance:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://foodbridge:${DB_PASSWORD}@db:5432/foodbridge
      API_READY_URL: http://api:8000/health/ready
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_PATH:-foodbridge-backups}:/backups
    depends_on: [api]
    restart: unless-stopped
volumes:
  foodbridge-db:
  foodbridge-backups:

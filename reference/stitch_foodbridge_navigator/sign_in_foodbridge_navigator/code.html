<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary": "#ffffff", "surface-variant": "#e0e3e8", "primary-fixed-dim": "#82d3de", "on-secondary": "#ffffff", "surface-container-lowest": "#ffffff", "on-primary-fixed": "#001f23", "inverse-surface": "#2d3135", "primary-container": "#006d77", "surface": "#f7f9ff", "tertiary": "#004e7a", "surface-dim": "#d7dadf", "secondary": "#2c694e", "primary-fixed": "#9ff0fb", "secondary-container": "#aeeecb", "surface-bright": "#f7f9ff", "on-primary": "#ffffff", "surface-tint": "#006972", "tertiary-container": "#00679f", "outline-variant": "#bec8ca", "tertiary-fixed": "#cde5ff", "on-tertiary-fixed": "#001d32", "on-tertiary-fixed-variant": "#004b74", "on-secondary-fixed": "#002114", "surface-container-highest": "#e0e3e8", "on-error-container": "#93000a", "surface-container": "#ebeef3", "surface-container-low": "#f1f4f9", "secondary-fixed": "#b1f0ce", "on-secondary-container": "#316e52", "surface-container-high": "#e5e8ee", "error-container": "#ffdad6", "primary": "#00535b", "on-surface-variant": "#3e494a", "secondary-fixed-dim": "#95d4b3", "on-secondary-fixed-variant": "#0e5138", "on-surface": "#181c20", "on-background": "#181c20", "on-primary-fixed-variant": "#004f56", "outline": "#6f797a", "tertiary-fixed-dim": "#94ccff", "background": "#f7f9ff", "on-tertiary-container": "#c5e2ff", "on-error": "#ffffff", "inverse-on-surface": "#eef1f6", "inverse-primary": "#82d3de", "error": "#ba1a1a", "on-primary-container": "#9becf7" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "max-width": "1280px", "unit": "8px", "margin-desktop": "32px", "gutter": "16px", "margin-mobile": "16px", "md": "16px", "xl": "32px", "lg": "24px", "sm": "8px", "xxl": "48px", "xs": "4px" }, "fontFamily": { "label-sm": ["Inter"], "display-lg": ["Inter"], "headline-md": ["Inter"], "title-md": ["Inter"], "label-md": ["Inter"], "headline-lg-mobile": ["Inter"], "body-sm": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"] }, "fontSize": { "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface text-on-surface min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin-mobile flex items-center justify-between"><button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button></div></header><main class="flex-1 flex flex-col relative w-full pt-16 bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-safe">
<!-- Brand Showcase & Civic Welcome Header -->
<div class="flex flex-col items-center text-center mt-lg mb-xl"><img alt="FoodBridge logo" class="h-12 w-auto object-contain mb-md" src="https://lh3.googleusercontent.com/aida/AEtjO1WQJGx6_dtNnd7STFO6Qv7v2YE2OrTYi9vwlSK_TarS8ch4s5ZM14LlRx69p8QnVOVKgp2cbGpE2mf9jYZDZU70LVKGRtHDTAl_BrKkNFPund35TzQjwNyiVnujHygLSJGExOrm-w0FE0KrtloaB1rlS4fR05ePr_z1_2m1s6parVJUIgsho-MRdDGhWpGljszkuy8VKTX8hz6-FpJ7jD2vePs7NdXYCODjsnxQGFFpZq-UbmpL-t0TZ5sp"><h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-semibold tracking-tight">Welcome to FoodBridge</h2><p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px] mt-xs">Nourishing communities with dignity, ease, and trust.</p></div>
<!-- Main Card Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-lg flex flex-col gap-lg">
<!-- Primary Civic Login Option (Singpass) -->
<button class="w-full min-h-[48px] bg-surface-container-lowest text-on-surface hover:bg-surface-container-low border border-outline-variant rounded-lg flex items-center justify-center gap-sm px-md py-sm shadow-xs active:scale-[0.98] transition-all font-label-md text-label-md font-medium cursor-pointer" id="google-signin-btn" type="button"><svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path></svg><span class="">Continue with Google</span></button>
<!-- Visual Tonal Divider -->
<div class="flex items-center gap-sm my-xs">
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
<span class="font-label-sm text-label-sm text-outline font-medium">or continue with email</span>
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
</div>
<!-- Email & Password Form -->
<form class="flex flex-col gap-md" id="login-form" onsubmit="event.preventDefault(); handleFormSubmit();">
<!-- Email or Mobile Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface font-medium" for="identifier-input">
          Email or Registered Phone
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline text-[20px] pointer-events-none">
            mail
          </span>
<input autocomplete="username" class="w-full min-h-[48px] pl-[46px] pr-md py-sm bg-surface-container-low text-on-surface rounded-lg font-body-sm text-body-sm focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#00535b] transition-all outline-none" id="identifier-input" name="identifier" placeholder="e.g. name@domain.sg or +65 9123 4567" required="" type="text">
</div>
</div>
<!-- Password Field with Show/Hide -->
<div class="flex flex-col gap-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface font-medium" for="password-input">
            Password
          </label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="javascript:void(0)">
            Forgot password?
          </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline text-[20px] pointer-events-none">
            key
          </span>
<input autocomplete="current-password" class="w-full min-h-[48px] pl-[46px] pr-12 py-sm bg-surface-container-low text-on-surface rounded-lg font-body-sm text-body-sm focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#00535b] transition-all outline-none" id="password-input" name="password" placeholder="Enter your password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-xs w-11 h-11 flex items-center justify-center text-outline hover:text-on-surface rounded-full transition-colors" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Switch -->
<div class="flex items-center justify-between pt-xs">
<label class="flex items-center gap-sm cursor-pointer select-none">
<input class="w-5 h-5 rounded text-primary focus:ring-0 bg-surface-container cursor-pointer accent-primary" id="remember-me" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface">Keep me signed in</span>
</label>
</div>
<!-- Submit Button -->
<button class="w-full min-h-[48px] mt-xs bg-primary text-on-primary rounded-lg font-label-md text-label-md font-semibold flex items-center justify-center gap-xs shadow-sm active:bg-primary-container active:scale-[0.99] transition-all" id="submit-btn" type="submit">
<span class="material-symbols-outlined text-[18px]">login</span>
<span class="">Sign In</span>
</button>
</form>
<!-- Partner & Coordinator Quick Switcher -->

</div>
<!-- Immediate Help & Guest Access -->
<div class="flex flex-col items-center gap-sm mt-lg"><p class="font-body-sm text-body-sm text-on-surface-variant text-center">Don't have an account? <a class="text-primary font-semibold hover:underline" href="javascript:void(0)">Create an account</a></p><a class="inline-flex items-center gap-xs font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors py-sm" href="javascript:void(0)"><span class="material-symbols-outlined text-[18px]">explore</span><span class="">Browse pantries as guest</span><span class="material-symbols-outlined text-[16px]">chevron_right</span></a></div>
<!-- Civic & Privacy Reassurance Notice -->
<div class="mt-xl mb-md flex items-center justify-center gap-xs text-outline"><span class="material-symbols-outlined text-[16px]">lock</span><span class="font-label-sm text-[12px] text-outline text-center">Safeguarded under Singapore PDPA guidelines</span></div>
</div>
<script>
  // Simple micro-interactions for password reveal & civic mock triggers
  const toggleBtn = document.getElementById('toggle-password-btn');
  const passwordInput = document.getElementById('password-input');
  const toggleIcon = document.getElementById('password-toggle-icon');

  if (toggleBtn && passwordInput && toggleIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  function handleFormSubmit() {
    const btn = document.getElementById('submit-btn');
    if (btn) {
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Signing in...</span>';
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span><span>Welcome back</span>';
      }, 1000);
    }
  }

  const singpassBtn = document.getElementById('singpass-btn');
  if (singpassBtn) {
    singpassBtn.addEventListener('click', () => {
      singpassBtn.classList.add('opacity-90');
      setTimeout(() => {
        singpassBtn.classList.remove('opacity-90');
      }, 200);
    });
  }
</script></main>



</body></html>
